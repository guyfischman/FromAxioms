name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1

      # The audit is the project's distinguishing claim, so it is checked here
      # rather than described in the README. `--check` fails on a declaration
      # reaching `Classical.choice`, `em` or `choice` with no entry in
      # `tools/classical.json`; on an entry whose subject is gone; and on a
      # stale `AXIOMS.md`. It sweeps every declaration rather than reading the
      # hand-written `#print axioms` lines.
      - name: Axiom audit
        run: python3 tools/audit.py --check

      # THE OTHER HALF OF THE SAME QUESTION. `audit.py` measures what a proof
      # USES; a principle taken as a hypothesis never reaches a `#print axioms`
      # line, so a conditional theorem can carry excluded middle in a binder and
      # audit clean. These two check the assumption side: that every principle
      # assumed is registered with its calibration, and that each is spent where
      # the registry says it is.
      - name: Hypothesis registry
        run: python3 tools/hypotheses.py --check

      - name: Where principles are spent
        run: python3 tools/hypcost.py --check
