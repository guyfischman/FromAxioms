name: Pages

# The dependency graph is generated here and served from Pages; it is never
# committed. `figures/dag.html` is a function of the library and the exporter,
# so a copy in the tree is a second source of truth that goes stale silently --
# and a 37 KiB generated file in every diff hides the mathematics the commit is
# about.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1

      # The graph reads the ELABORATED environment, not the source text, so
      # the library has to be built before it can be asked what depends on
      # what. `lean-action` has already done that.
      - name: Export the elaborated declarations
        run: python3 tools/astexport.py

      - name: Draw the dependency graph
        run: python3 tools/dag.py --record

      # Pages serves the directory root, and the graph is the only thing here
      # worth landing on.
      - name: Serve the graph as the site root
        run: cp figures/dag.html figures/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: figures

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
