name: Comparators

# SEPARATE FROM `ci.yml`, AND ON PURPOSE. A pair imports Mathlib to state the
# theorem it matches, so this job resolves a full Mathlib and the main build
# must not. Running it on every push would put an hour of Mathlib between the
# author and a one-line proof, so it runs on the schedule and on demand, and
# `lake exe cache get` takes the oleans rather than compiling them.
#
# THE AUDIT IS THE JOB. `lake build` elaborating is not the claim: a Solution
# that imported Mathlib and proved the challenge from it would build green.
# `Comparator/Audit.lean` runs during the build and fails it when a pair reaches
# no tower proposition, or reaches a Mathlib theorem that Mathlib's own proof of
# the challenge uses.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'comparator/**'

jobs:
  pairs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false

      - name: Mathlib oleans
        working-directory: comparator
        run: lake exe cache get

      - name: Build the pairs and run the audit
        working-directory: comparator
        run: lake build

      # `PAIRS.md` is written by the audit during that build, so a stale one
      # means the committed table no longer describes the pairs. Same contract
      # as `AXIOMS.md`: generated, committed, and checked to be current rather
      # than trusted.
      - name: The pair table is current
        working-directory: comparator
        run: git diff --exit-code -- PAIRS.md
