# Comparator pairs: what this library discharges when the theorem is
# stated in Mathlib's own words.
#
# Each pair is a directory under `comparator/Comparator/`.
# `Challenge.lean` imports Mathlib and states the theorem in Mathlib's
# vocabulary, and `challenge_is_mathlibs` discharges that statement
# from Mathlib, so the statement being matched is certified as
# Mathlib's. `Solution.lean` then proves the same statement from
# `FromAxioms` alone. A reader who trusts Mathlib and distrusts
# everything here can still read the pair, because the proposition
# being proved was not ours to bend.
#
# A pair counts when `lake build` in `comparator/` is green, which
# runs `Comparator/Audit.lean`: it fails the build if a solution
# reaches no proposition proved under `FromAxioms/`, or reaches a
# Mathlib theorem that Mathlib's own proof of the challenge uses.
#
# Nothing under `FromAxioms/` imports Mathlib.
# `python3 tools/imports.py --check` gates that in both directions.

version: 1

toolchain:
  lean: leanprover/lean4:v4.24.0
  mathlib: v4.24.0
  checkout: comparator/.lake/packages/mathlib
  note: >
    A pair imports both Mathlib and FromAxioms, so one Lean must build both.
    Statements are read from the pinned checkout above, whose exact revision is
    recorded in `comparator/lake-manifest.json`.

pairs:
  - id: nat-add-succ
    date: 1861
    rows:
      - "recursive definition of + on ℕ"
    mathlib: Nat.add_succ
    mathlib_source: Lean core, inherited by Mathlib
    ours: NumberTheory.add_succ
    status: complete
    note: >
      THE STATEMENT IS FREE ON MATHLIB'S SIDE, SO THE ROUTE IS WHAT IS
      CHECKED. Lean core proves `Nat.add_succ` by `rfl` on an inductive
      type and mathlib does not define its own naturals, so a Solution
      that also said `rfl` would prove NOTHING about this tower; ours is a
      theorem about a set construction.
      The Solution embeds both naturals as von
      Neumann ordinals, uses `Arith.add_succ` --- `add x (succ y) =
      succ (add x y)` for ARBITRARY `ZFSet`s, proved by EXTENSIONALITY and not
      by computation --- returns through `add_ofNat`, which says the tower's
      addition agrees with Lean's under the embedding, and closes with
      `ofNat_injective`. What is verified is that the set-theoretic recursion
      DISCHARGES Lean's arithmetic equation.
      `Solution.lean` CONTAINS NO `rfl`, and that is the only thing separating a
      real Solution here from a vacuous one, so it is stated in the file rather
      than left for a reader to check. The three `rfl` occurrences a grep finds
      are all in the docstring explaining the absence.
      IT ALSO PRINTS `[propext, Quot.sound]` --- no `Classical.choice` ---
      since this route never touches the type encoding the algebraic pairs
      need.

  - id: det-mul
    rows:
      - "multiplicativity of the determinant"
    mathlib: Matrix.det_mul
    mathlib_source: Mathlib/LinearAlgebra/Matrix/Determinant/Basic.lean:134
    ours: Algebra.detN_mul
    status: complete
    note: >
            TWO ROUTES LOOKED FORCED AND NEITHER IS REQUIRED. Stating a challenge
      with `Matrix.det` seemed to need `Matrix.det = detT` first, by either
      the permutation transfer, which needs
      `Equiv.Perm.sign s = (-1)^(inversions s)` and MATHLIB DOES NOT HAVE IT,
      or the uniqueness route through `AlternatingMap.eq_smul_basis_det`,
      needing this tree's seven-lemma alternating ladder over a Lean type.
      THE ROUTE IS A THIRD ONE. `Comparator.DetTransfer.detN_encMat` proves
      `detN (encMat M) = encode M.det` by INDUCTION ON THE SIZE, using
      mathlib's own Laplace expansion `Matrix.det_succ_row_zero` --- which is
      how `detN` is defined, so the step is term-by-term and no permutation
      parity appears.
      THE OBSTRUCTION WAS READ FROM MATHLIB'S DEFINITION RATHER THAN ITS
      THEOREMS. `Matrix.det` IS the Leibniz sum definitionally, which is what
      made both routes above look forced; a proved Laplace expansion is as
      usable as a definitional one.
      THE PAIR ITSELF IS AN ASSEMBLY: one theorem plus a bounded congruence
      over a carrier that was already built. `detN_congr_lt` is the only
      step beyond a rewrite --- `matMulOn_encMat` matches the transported
      product with `encMat (M * N)` ONLY ON THE SQUARE, and the unbounded
      congruence would not apply.
      `m = 0` IS A CASE SPLIT, NOT A WEAKENING. `detN_mul` carries `0 < n` and
      mathlib's holds at every size; at zero both determinants are `1` by
      `Matrix.det_fin_zero`. The challenge is discharged over an arbitrary
      `CommRing` rather than a fixed one. It is NARROWER THAN MATHLIB ON THE
      INDEX: mathlib's `det_mul` is over any `[Fintype n] [DecidableEq n]`
      and this fixes `Fin m`, so transporting along `n ≃ Fin (card n)` is
      the step still owed.
      THE TOWER THEOREM UNDER THE PAIR IS CHOICE-FREE AND THE STATEMENT IS
      NOT. `detN_mul` and `detN_congr_lt` are `[propext, Quot.sound]`, while
      `Matrix.det` itself is `[propext, Quot.sound, Classical.choice]`, so no
      proof of this statement prints without choice whatever route it takes.
      The encoding spends choice too; the axiom line cannot separate the two
      sources once both are present.

  - id: pair-encoding
    date: 1921
    rows:
      - "the ⟨a,b⟩ = {{a},{a,b}} encoding"
    mathlib: none --- the challenge is discharged from Lean CORE
    ours: ZFSet.opair_eq_opair_iff
    status: complete
    note: >
      NO MATHLIB THEOREM IS NAMED BECAUSE THERE IS NONE TO NAME, and
      that is measured rather than assumed: `Comparator/Audit.lean`
      walks this challenge's compiled witness and reports ZERO Mathlib
      propositions in its dependency set --- it rests on Lean core
      (`Classical.em`, `Classical.choose`, `Nat.rec`, `Prod.ext`).
      `mathlib_source` is omitted for the same reason: there is no
      declaration to cite, and a line number invented to fill the
      field would be worse than the blank.

  - id: irrational-sqrt-prime
    date: -540
    rows:
      - "irrationality of √2"
    mathlib: Nat.Prime.irrational_sqrt
    mathlib_source: Mathlib/RingTheory/Real/Irrational.lean:131
    ours: NumberTheory.prime_sq_irrational
    status: complete
    note: >
      The challenge quantifies over every prime, as Mathlib's theorem does. Our
      side is `∀ a b : Nat, a * a = n * (b * b) → b = 0` --- no reals, no
      subtraction --- so no number system is transferred, only a bridge between
      two spellings of primality over the same `Nat`. Mathlib supplies the
      plumbing from `Real.sqrt` down to that statement and none of the
      arithmetic.

  - id: norm-add-sq
    date: -500
    rows:
      - "the Pythagorean theorem"
    mathlib: norm_add_sq_real
    mathlib_source: Mathlib/Analysis/InnerProductSpace/Basic.lean:390
    ours: Analysis.isInnerFormT_add_self
    status: complete
    note: >
      THIS ROW IS WHY THE PAIRS EXIST. It read `audited` for weeks on
      `innerProduct_add_self`, over `IsInnerProduct`, whose every argument is a
      `ZFSet` --- so it could not be applied to `F : Type*` at all. Writing the
      pair is what moved it to `narrower`. The repair was a re-siting, not a
      retreat: the proof consumes only symmetry and left-additivity, so
      `isInnerFormT_add_self` states the expansion over arbitrary Lean types
      with those as two plain equations, and prints NO axioms --- a lower floor
      than the `ZFSet` form it generalises.

  - id: bezout
    date: -300
    rows:
      - "Bezout's identity"
      - "solving equations in integers"
    mathlib: Nat.gcd_eq_gcd_ab
    mathlib_source: Mathlib/Data/Int/GCD.lean:126
    ours: NumberTheory.bezout_int
    status: complete
    gap: >
      Mathlib names `Nat.gcdA` and `Nat.gcdB` as computable witnesses from the
      extended Euclidean algorithm; ours is an existential. The challenge is
      stated existentially and Mathlib's witnesses inhabit it, so it is a
      consequence of Mathlib's theorem rather than a weakening --- but a pair at
      Mathlib's literal statement would need us to name witnesses and prove
      those specific ones work.

  - id: chinese-remainder
    date: -300
    rows:
      - "the Chinese remainder theorem"
    mathlib: Nat.chineseRemainder
    mathlib_source: Mathlib/Data/Nat/ModEq.lean:353
    ours: NumberTheory.crt
    status: complete
    note: >
      Our `Cong n a b := a % n = b % n` and Mathlib's `Nat.ModEq n a b :=
      a % n = b % n` are the SAME definition, so `k ≡ a [MOD n]` and
      `Cong n k a` are definitionally equal and no bridge lemma is needed.
    gap: >
      Writing the pair exposed a hypothesis nothing had recorded: our `crt`
      demands `0 < n` where `Nat.chineseRemainder` demands only coprimality, and
      the case is real --- `Coprime n 0` forces `n = 1`. The solution discharges
      it by hand, so the pair is complete, but the tower's theorem is narrower
      by that hypothesis. Separately, Mathlib's `ZMod.chineseRemainder` is a ring
      ISOMORPHISM over a Lean type while `isRingIso_crtMap_int` is over `ZFSet`
      quotient rings; that axis needs a re-siting this pair does not do.

  - id: infinitude-primes
    date: -300
    rows:
      - "infinitude of primes"
    mathlib: Nat.exists_infinite_primes
    mathlib_source: Mathlib/Data/Nat/Prime/Infinite.lean:29
    ours: NumberTheory.exists_prime_ge
    status: complete
    note: >
      Both sides quantify over Lean's `Nat`, so nothing is transferred; the only
      step is `Comparator/Bridge/NatPrime.lean`, which relates the two spellings
      of primality as an iff and is shared with `irrational-sqrt-prime`.

  - id: unique-factorisation
    date: 1801
    rows:
      - "unique factorisation"
    mathlib: Nat.primeFactorsList_unique
    mathlib_source: Mathlib/Data/Nat/Factors.lean:173
    ours: NumberTheory.factorization_perm
    status: complete
    note: >
      `Nat.factors_unique`, which the registry named, does not exist --- mathlib
      renamed the family to `primeFactorsList`. Mathlib's statement is relative
      to that canonical list; ours is symmetric, so mathlib's is the instance at
      `l₂ := primeFactorsList n` and the tower's theorem is the stronger of the
      two. Both sides are over Lean's `Nat`, so nothing is transferred: the pair
      is the `prodList`/`List.prod` bridge and the zero case, where
      `primeFactorsList 0` is empty and `0` is not prime.

  - id: int-no-zero-div
    date: 628
    rows:
      - "zero and the negative numbers"
    mathlib: mul_eq_zero
    mathlib_source: Mathlib/Algebra/GroupWithZero/Defs.lean:283
    ours: NumberTheory.intMul_ne_zero
    status: complete
    note: >
      Registered from the compiled proof terms rather than by hand:
      `mathlib` is the first Mathlib proposition Lean reports the
      challenge's witness depending on, and `ours` is the tower
      theorem the Solution rests on. `Comparator/Audit.lean` is the
      instrument and re-derives both.

  - id: fan-theorem
    rows:
      - "Brouwer's fan theorem"
    mathlib: "(none --- unnamed, derivable classically from compactness)"
    ours: Constructive.fanDelta_of_decider
    status: complete
    note: >
      THE COST IS ON THE CHALLENGE SIDE HERE, which is unusual on this track.
      Every other pair states something mathlib proves and asks whether the
      tower can match it; this one has to WRITE the classical argument, because
      searching the pinned v4.24.0 for `koenig`, `konig` and `Koenig` returns
      only `SetTheory/Cardinal/*`, which is Koenig's theorem on cardinal
      arithmetic and has nothing to do with binary trees. There is no Koenig's
      LEMMA in mathlib to cite. `Solution.lean` is four lines by comparison: the
      tower states the fan theorem as a named principle and derives it from a
      decider.

  - id: product-universal
    date: 1914
    rows:
      - "ordered pair from sets"
    mathlib: none --- the challenge is discharged from Lean CORE
    ours: SetTheory.opair_eq_opair_iff
    status: complete
    note: >
      NO MATHLIB THEOREM IS NAMED BECAUSE THERE IS NONE TO NAME, and
      that is measured rather than assumed: `Comparator/Audit.lean`
      walks this challenge's compiled witness and reports ZERO Mathlib
      propositions in its dependency set --- it rests on Lean core
      (`Classical.em`, `Classical.choose`, `Nat.rec`, `Prod.ext`).
      `mathlib_source` is omitted for the same reason: there is no
      declaration to cite, and a line number invented to fill the
      field would be worse than the blank.

  - id: soundness
    date: 1930
    rows:
      - "intuitionistic logic as a formal system"
    mathlib: none --- the challenge is discharged from Lean CORE
    ours: Algebra.soundness
    status: complete
    note: >
      NO MATHLIB THEOREM IS NAMED BECAUSE THERE IS NONE TO NAME, and
      that is measured rather than assumed: `Comparator/Audit.lean`
      walks this challenge's compiled witness and reports ZERO Mathlib
      propositions in its dependency set --- it rests on Lean core
      (`Classical.em`, `Classical.choose`, `Nat.rec`, `Prod.ext`).
      `mathlib_source` is omitted for the same reason: there is no
      declaration to cite, and a line number invented to fill the
      field would be worse than the blank.
